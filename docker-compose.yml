version: "3.8"

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: axelor-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  axelor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GRADLE_VERSION: ${GRADLE_VERSION}
        AXELOR_REPO: ${AXELOR_REPO}
        AXELOR_VERSION: ${AXELOR_VERSION}
        AXELOR_PORT: ${AXELOR_PORT}
        AXELOR_DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
        AXELOR_DB_USER: ${DB_USER}
        AXELOR_DB_PASSWORD: ${DB_PASSWORD}
    container_name: axelor-app
    environment:
      JAVA_OPTS: ${JAVA_OPTS}
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${AXELOR_PORT}:7070"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - axelor_data:/usr/local/tomcat/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AXELOR_PORT}"]
      interval: ${HEALTH_CHECK_INTERVAL}
      timeout: ${HEALTH_CHECK_TIMEOUT}
      retries: ${HEALTH_CHECK_RETRIES}
      start_period: ${HEALTH_CHECK_START_PERIOD}

  pgadmin:
    image: ${PGADMIN_IMAGE}
    container_name: axelor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  axelor_data:
