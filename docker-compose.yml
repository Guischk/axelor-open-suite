version: "3.8"

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: axelor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  axelor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GRADLE_VERSION: ${GRADLE_VERSION}
        AXELOR_REPO: ${AXELOR_REPO}
        AXELOR_VERSION: ${AXELOR_VERSION}
        AXELOR_DB_URL: ${AXELOR_DB_URL}
        AXELOR_DB_USER: ${AXELOR_DB_USER}
        AXELOR_DB_PASSWORD: ${AXELOR_DB_PASSWORD}
    container_name: axelor-app
    environment:
      JAVA_OPTS: ${JAVA_OPTS}
      DB_URL: ${AXELOR_DB_URL}
      DB_USER: ${AXELOR_DB_USER}
      DB_PASSWORD: ${AXELOR_DB_PASSWORD}
    ports:
      - "${AXELOR_PORT}:7070"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${UPLOAD_DIR}:/usr/local/tomcat/data/uploads
      - ${EXPORT_DIR}:/usr/local/tomcat/data/export
      - ${INDEXES_DIR}:/usr/local/tomcat/data/indexes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  pgadmin:
    image: ${PGADMIN_IMAGE}
    container_name: axelor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
